name: Idea
description: Qualcosa che manca o un modo migliore di fare una cosa. Something missing or a better way to do something.
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: L'idea / The idea
      description: Cosa vorresti e perché ti servirebbe. What you'd like and why it would help.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: App, macOS, Mac
      description: Compilato dall'app. Filled in by the app.
